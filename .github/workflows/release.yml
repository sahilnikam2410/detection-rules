name: release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Wazuh rule bundles
        run: |
          mkdir -p dist
          bundle() {
            out="$1"; shift
            {
              echo "<!-- sahilnikam2410/detection-rules ${GITHUB_REF_NAME} · paste into /var/ossec/etc/rules/local_rules.xml -->"
              for f in "$@"; do echo "<!-- $f -->"; cat "$f"; done
            } > "dist/$out"
          }
          bundle detection-rules-validated.xml wazuh/validated/*.xml
          bundle detection-rules-all.xml wazuh/validated/*.xml wazuh/drafts/*.xml
          cp queries/splunk/*.spl dist/
          ls -la dist
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
